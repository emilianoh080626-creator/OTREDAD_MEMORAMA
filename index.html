<title>Memorama de la otredad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* Concepto: dos círculos que se cruzan (yo y el otro) en el reverso; la mesa es un tablero sobrio de aula.
     Color: pizarra azulada, índigo como acento, verde y rojo solo para acierto y error. */
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --fg: #172033;
    --muted: #556079;
    --line: #d5dbe8;
    --accent: #2f45c9;
    --accent-ink: #ffffff;
    --back: #26399a;
    --back-line: rgba(255, 255, 255, .38);
    --ok: #16805a;
    --ok-soft: #dcf3e8;
    --miss: #c0391b;
    --shadow: 0 1px 2px rgba(23, 32, 51, .08), 0 6px 16px rgba(23, 32, 51, .08);
    --f-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1424;
      --surface: #1a2239;
      --fg: #e8ecf7;
      --muted: #9ba7c2;
      --line: #2b3552;
      --accent: #8da0ff;
      --accent-ink: #0e1424;
      --back: #2b3fa3;
      --back-line: rgba(255, 255, 255, .34);
      --ok: #4cc38a;
      --ok-soft: #14352b;
      --miss: #ff8a6b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1424;
    --surface: #1a2239;
    --fg: #e8ecf7;
    --muted: #9ba7c2;
    --line: #2b3552;
    --accent: #8da0ff;
    --accent-ink: #0e1424;
    --back: #2b3fa3;
    --back-line: rgba(255, 255, 255, .34);
    --ok: #4cc38a;
    --ok-soft: #14352b;
    --miss: #ff8a6b;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; flex-direction: column; gap: 6px; }
  .kicker {
    font-size: .78rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);
  }
  h1 {
    font-family: var(--f-display); font-weight: 800; font-size: clamp(1.9rem, 6vw, 2.9rem);
    line-height: 1.05; margin: 0; letter-spacing: -.02em; text-wrap: balance;
  }
  .lead { margin: 0; color: var(--muted); max-width: 60ch; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat b {
    font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat span { color: var(--muted); font-size: .9rem; }
  .spacer { flex: 1 1 0; }
  button.reset {
    font: inherit; font-weight: 600; color: var(--accent-ink); background: var(--accent);
    border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  button.reset:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .board {
    display: grid; gap: 12px;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  @media (max-width: 759px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } }
  @media (max-width: 479px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  .card {
    appearance: none; border: 0; padding: 0; margin: 0; background: none; font: inherit; color: inherit;
    aspect-ratio: 16 / 9; width: 100%; cursor: pointer; perspective: 800px;
    container-type: inline-size; -webkit-tap-highlight-color: transparent;
  }
  .inner {
    position: relative; display: block; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform .45s cubic-bezier(.3, .7, .3, 1);
  }
  .card.up .inner, .card.done .inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; border-radius: 10px; overflow: hidden;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .back { background: var(--back); box-shadow: var(--shadow); }
  .back svg { width: 62%; height: auto; max-height: 70%; }
  .card:hover:not(.up):not(.done) .back { filter: brightness(1.12); }
  .front {
    transform: rotateY(180deg); background: var(--surface);
    border: 2px solid var(--line); box-shadow: var(--shadow);
  }
  .card.done .front { border-color: var(--ok); }
  .card.miss .front { border-color: var(--miss); }

  .word {
    font-family: var(--f-display); font-weight: 800; text-transform: uppercase;
    font-size: clamp(.78rem, 11.5cqw, 1.55rem); letter-spacing: .02em; padding: 0 6px; text-align: center;
  }
  .card.done .word { color: var(--ok); }
  .front img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tag {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px;
    background: var(--ok); color: #fff; text-align: center;
    font-family: var(--f-display); font-weight: 700; font-size: clamp(.62rem, 7.5cqw, .95rem);
    letter-spacing: .06em; text-transform: uppercase;
  }
  .kind {
    position: absolute; top: 6px; left: 6px; font-size: .68rem; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); display: none;
  }

  .status {
    min-height: 3rem; display: flex; align-items: center; color: var(--muted);
  }
  .status.win {
    color: var(--fg); background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 10px;
    padding: 12px 16px; gap: 14px; flex-wrap: wrap; justify-content: space-between;
  }
  .status strong { font-family: var(--f-display); font-size: 1.15rem; }

  @media (prefers-reduced-motion: reduce) { .inner { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="kicker">Otredad · Memorama</div>
    <h1>Memorama de la otredad</h1>
    <p class="lead">Voltea dos cartas por turno. Busca la palabra y la imagen que le corresponde. Hay 6 parejas.</p>
  </header>

  <div class="bar">
    <div class="stat"><b id="moves">0</b><span>movimientos</span></div>
    <div class="stat"><b id="pairs">0 / 6</b><span>parejas</span></div>
    <div class="spacer"></div>
    <button class="reset" id="reset" type="button">Reiniciar</button>
  </div>

  <div class="board" id="board"></div>

  <div class="status" id="status" role="status" aria-live="polite">Elige una carta para empezar.</div>
</div>

  const ALTS = {
    "ALTERIDAD": "Ilustración de una mujer y un hombre mirándose de frente, unidos por una línea luminosa",
    "IDENTIDAD": "Ilustración de una persona sosteniendo un espejo rodeada de símbolos como libro, música, pincel y mundo",
    "EMPATÍA": "Ilustración de dos personas sentadas en un sillón tomadas de las manos mientras conversan",
    "DIVERSIDAD": "Ilustración de un grupo de siete personas distintas abrazadas y sonriendo",
    "ALIENACIÓN": "Ilustración de una persona sola en una cabina de cristal rodeada de siluetas en una estructura industrial",
    "INCLUSIÓN": "Ilustración de un jardín comunitario con personas de distintas edades y capacidades conviviendo"
  };
  const TOTAL = CARDS.length;
  const boardEl = document.getElementById("board");
  const movesEl = document.getElementById("moves");
  const pairsEl = document.getElementById("pairs");
  const statusEl = document.getElementById("status");

  const BACK_SVG = '<svg viewBox="0 0 160 90" aria-hidden="true" fill="none" stroke="var(--back-line)" stroke-width="3">' +
    '<circle cx="64" cy="45" r="26"/><circle cx="96" cy="45" r="26"/></svg>';

  let deck = [], open = [], matched = 0, moves = 0, locked = false;

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setLabel(btn, faceUp) {
    const c = btn._card;
    if (!faceUp) { btn.setAttribute("aria-label", "Carta boca abajo"); return; }
    btn.setAttribute("aria-label", c.kind === "word" ? "Palabra: " + c.word : "Imagen: " + ALTS[c.word]);
  }

  function build() {
    deck = [];
    CARDS.forEach((c, i) => {
      deck.push({ id: i, kind: "word", word: c.w });
      deck.push({ id: i, kind: "image", word: c.w, src: c.src });
    });
    shuffle(deck);
    boardEl.innerHTML = "";
    deck.forEach(c => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "card";
      b._card = c;
      b.innerHTML = '<span class="inner"><span class="face back">' + BACK_SVG + '</span><span class="face front"></span></span>';
      const front = b.querySelector(".front");
      if (c.kind === "word") {
        const s = document.createElement("span");
        s.className = "word";
        s.textContent = c.word;
        front.appendChild(s);
      } else {
        const img = document.createElement("img");
        img.src = c.src;
        img.alt = "";
        img.draggable = false;
        front.appendChild(img);
      }
      setLabel(b, false);
      b.addEventListener("click", () => flip(b));
      boardEl.appendChild(b);
    });
    open = []; matched = 0; moves = 0; locked = false;
    movesEl.textContent = "0";
    pairsEl.textContent = "0 / " + TOTAL;
    statusEl.className = "status";
    statusEl.textContent = "Elige una carta para empezar.";
  }

  function flip(btn) {
    if (locked || btn.classList.contains("up") || btn.classList.contains("done")) return;
    btn.classList.add("up");
    setLabel(btn, true);
    open.push(btn);
    if (open.length < 2) {
      statusEl.textContent = "Ahora busca su pareja.";
      return;
    }
    moves++;
    movesEl.textContent = String(moves);
    const [a, b] = open;
    if (a._card.id === b._card.id && a._card.kind !== b._card.kind) {
      [a, b].forEach(x => {
        x.classList.remove("up");
        x.classList.add("done");
        if (x._card.kind === "image") {
          const t = document.createElement("span");
          t.className = "tag";
          t.textContent = x._card.word;
          x.querySelector(".front").appendChild(t);
          x.querySelector("img").alt = ALTS[x._card.word];
        }
      });
      matched++;
      open = [];
      pairsEl.textContent = matched + " / " + TOTAL;
      if (matched === TOTAL) {
        statusEl.className = "status win";
        statusEl.innerHTML = '<strong>¡Lo lograste en ' + moves + ' movimientos!</strong>';
        const again = document.createElement("button");
        again.type = "button"; again.className = "reset"; again.textContent = "Jugar de nuevo";
        again.addEventListener("click", build);
        statusEl.appendChild(again);
      } else {
        statusEl.textContent = "¡Pareja! " + a._card.word + " va con su imagen.";
      }
    } else {
      locked = true;
      statusEl.textContent = "No coinciden. Memoriza dónde están.";
      [a, b].forEach(x => x.classList.add("miss"));
      setTimeout(() => {
        [a, b].forEach(x => {
          x.classList.remove("up", "miss");
          setLabel(x, false);
        });
        open = [];
        locked = false;
      }, 1100);
    }
  }

  document.getElementById("reset").addEventListener("click", build);
  build();
</script>
